name: Release

on:
  push:
    tags:
      - "*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: -D warnings

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version consistency (tag == manifest == package.json)
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          echo "tag=$TAG manifest=$MANIFEST package=$PACKAGE"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::version mismatch: tag=$TAG manifest.json=$MANIFEST package.json=$PACKAGE (tags are without v-prefix)"
            exit 1
          fi

      - name: Run tests
        run: bun run test

      - name: Run Rust crate tests
        run: cargo test --workspace

      - name: Build WASM artifacts
        run: bun run wasm

      - name: Check WASM artifacts are fresh
        run: bun run wasm:check

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # Obsidian imposes no size limit (plugins far larger than this are in the
      # directory). This gate exists to catch a broken wasm embedding: the
      # module is inlined gzip+base64 (~1.07 MiB total). If someone drops the
      # compression the bundle jumps to ~3.1 MiB and this fails.
      - name: Check build size
        run: |
          SIZE=$(stat --format=%s main.js)
          LIMIT=2097152
          echo "main.js size: $SIZE bytes"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::main.js exceeds 2 MiB ($SIZE bytes) — is the wasm still gzip-embedded?"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            main.js
            manifest.json
            styles.css
