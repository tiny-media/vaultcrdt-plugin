name: Security

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  codeql-rust-wasm:
    name: CodeQL (rust, wasm crate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  osv-scanner:
    name: osv-scanner (bun.lock + Cargo.lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Scan lockfiles against the OSV database
        # Advisory mode until the findings are triaged: transitive
        # unmaintained-crate advisories (im family via loro) and rsa have no
        # fixed versions available. SARIF still lands in the Security tab.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.5.1 \
            --format sarif --output osv-results.sarif ./
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-results.sarif

  bun-audit:
    name: bun audit (all dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Audit dependencies (advisory database via GitHub Advisory DB)
        run: |
          bun install --frozen-lockfile
          bun audit

  cargo-audit:
    name: cargo audit (RustSec, wasm crate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          toolchain: "1.94"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock against RustSec
        run: cargo audit --file Cargo.lock

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
