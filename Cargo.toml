[workspace]
resolver = "2"
members = [
    "crates/vaultcrdt-core",
    "crates/vaultcrdt-crdt",
    "crates/vaultcrdt-wasm",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

# Size-optimized release builds — the WASM artifact ships inside the plugin,
# so binary size matters more than peak throughput (ersetzt .cargo/config.toml).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
# CRDT
loro = "=1.13.9"

# Hashing
blake3 = "1"

# Diffing
similar = "3.1.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# WASM — pinned to lockfile version for reproducible plugin builds
wasm-bindgen = "=0.2.128"

# Unicode (blob path key v1: NFC + full casefold)
unicode-normalization = "0.1.25"
caseless = "0.2.2"

# Error handling
thiserror = "2"

# Testing
proptest = "1"
